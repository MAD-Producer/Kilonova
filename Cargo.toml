[workspace]
members = [
    "crates/motion-effects",
    "crates/motion-graph",
    "crates/motion-model",
    "crates/motion-core",
    "crates/motion-render",
    "crates/motion-media",
    "crates/motion-host",
    "crates/motion-android",
    "crates/motion-desktop-media",
    "desktop/ui",
    "desktop/app",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
glam = { version = "0.29", features = ["serde"] }
thiserror = "2.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.release.package.motion-effects]
overflow-checks = true

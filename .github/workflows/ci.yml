name: CI

on:
  # Include stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR refs identify the PR, including forks with identical branch names.
  # Keep manual validation separate from trusted push publication.
  # false preserves a running push, not every pending push: GitHub replaces
  # an older pending run in the same group. Main previews are latest-wins.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch current RustSec advisories
        run: git -c http.version=HTTP/1.1 clone --depth 1 https://github.com/RustSec/advisory-db.git artifacts/dependency-audit-db
      - name: Audit all locked dependencies
        run: python tools/ci_dependency_audit.py --database artifacts/dependency-audit-db
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: |
            artifacts/dependency-audit/audit.json
            artifacts/dependency-audit/audit.stderr.log
            artifacts/dependency-audit/receipt.json
          if-no-files-found: warn
          retention-days: 7

  checks:
    name: Rust and GPU
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.release_policy.outputs.publish }}
    env:
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/motion-runtime
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      MOTION_EFFECT_REPORT: ${{ github.workspace }}/artifacts/effect-costs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select desktop release policy
        id: release_policy
        run: python tools/ci_release.py policy
      - name: Validate clean-room provenance guard
        run: python tools/validate_provenance.py
      - name: Install headless Vulkan and native build dependencies
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          grep '^URIs:' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libclang-18-dev fonts-noto-cjk libasound2-dev
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          rustup toolchain install 1.97.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: host-tests
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-on-failure: true
      - name: Validate tools and vector icons
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m compileall -q tools
          python tools/generate_desktop_icons.py --check
          python -m unittest discover -s tools -p 'test_ci_*.py' -v
          test -z "$(git ls-files docs)"
      # The offline dependency-boundary test reads metadata for all lockfile
      # targets, including packages the desktop test build does not compile.
      - name: Fetch locked metadata dependencies
        run: cargo fetch --locked
      - name: Run Rust and software Vulkan tests
        # Desktop packages run in parallel in the native desktop job below.
        run: cargo test --workspace --exclude motion-android --exclude motion-desktop --exclude motion-host --exclude motion-ui --exclude motion-desktop-media --locked -- --test-threads=1
      - name: Validate SDK packer with the Rust loader
        run: |
          cargo build --locked -p motion-effects --bin effect_tool
          MOTION_EFFECT_VALIDATOR="$GITHUB_WORKSPACE/target/debug/effect_tool" python -m unittest discover -s sdk/tests -v
          python tools/validation_inventory.py --effect-validator "$GITHUB_WORKSPACE/target/debug/effect_tool"
      - name: Validate portable loop bounds in release
        run: cargo test --locked --release -p motion-effects --lib --test loop_work -- --test-threads=1
      - name: Summarize effect costs
        if: always()
        run: |
          if [ -f "$MOTION_EFFECT_REPORT/effect-costs.md" ]; then
            cat "$MOTION_EFFECT_REPORT/effect-costs.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: effect-costs
          path: artifacts/effect-costs/**
          if-no-files-found: warn
          retention-days: 30

  desktop:
    name: Desktop build
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (matrix.os == 'macos-15-intel' || matrix.os == 'windows-2022') && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' &&
          '[{"os":"ubuntu-24.04","platform":"linux-x86_64","binary":"motion-studio","target":"x86_64-unknown-linux-gnu"},
          {"os":"windows-2022","platform":"windows-x86_64","binary":"motion-studio.exe","target":"x86_64-pc-windows-msvc"},
          {"os":"macos-15-intel","platform":"macos-x86_64","binary":"motion-studio","target":"x86_64-apple-darwin"}]' ||
          '[{"os":"ubuntu-24.04","platform":"linux-x86_64","binary":"motion-studio","target":"x86_64-unknown-linux-gnu"},
          {"os":"windows-2022","platform":"windows-x86_64","binary":"motion-studio.exe","target":"x86_64-pc-windows-msvc"},
          {"os":"macos-14","platform":"macos-arm64","binary":"motion-studio","target":"aarch64-apple-darwin"},
          {"os":"macos-15-intel","platform":"macos-x86_64","binary":"motion-studio","target":"x86_64-apple-darwin"}]') }}
    env:
      XDG_RUNTIME_DIR: /tmp/motion-runtime
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      PIP_CACHE_DIR: ${{ github.workspace }}/artifacts/ci-cache/pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install headless Vulkan and native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          grep '^URIs:' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libclang-18-dev fonts-noto-cjk xvfb libxkbcommon0 libxkbcommon-x11-0 libasound2-dev
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Install desktop target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-native
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-on-failure: true
      - name: Verify Windows GPU output coverage
        if: runner.os == 'Windows'
        run: cargo test -p motion-graph --test output_antialiasing --locked -- --test-threads=1
      - name: Verify native memory pressure adapter queries
        run: >-
          cargo test -p motion-render --test memory_pressure
          ${{ runner.os == 'Windows' && 'actual_dxgi_adapter_query_is_bounded_and_does_not_modify_admission' ||
          runner.os == 'macOS' && 'actual_metal_device_query_is_bounded_and_does_not_modify_admission' ||
          'actual_vulkan_adapter_query_is_available_or_explicitly_unsupported' }}
          --locked -- --exact --test-threads=1 --nocapture
      - name: Run desktop unit tests
        env:
          MOTION_SAMPLING_PLAYBACK_ARTIFACTS: ${{ github.workspace }}/artifacts/desktop/sampling-playback
          MOTION_FRAME_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/desktop/frame-export
          MOTION_POINT_SELECTION_ARTIFACTS: ${{ github.workspace }}/artifacts/desktop/path-selection
        run: cargo test -p motion-desktop -p motion-host -p motion-ui -p motion-desktop-media --locked --features motion-host/diagnostics,motion-ui/gpu-tests -- --test-threads=1
      - name: Build the desktop shell
        run: python tools/build_desktop.py --task check
      - name: Restore pinned libclang wheel cache
        if: github.event_name != 'pull_request'
        id: libclang_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/ci-cache/pip
          key: libclang-${{ runner.os }}-${{ runner.arch }}-py312-18.1.1-v1
      - name: Install portable libclang for FFmpeg bindings
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check libclang==18.1.1
          python -c "import os; from clang.cindex import Config; from pathlib import Path; p=Path(Config.library_path).resolve(strict=True); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('LIBCLANG_PATH=' + str(p) + '\n')"
      - name: Save pinned libclang wheel cache
        if: github.event_name == 'push' && steps.libclang_cache.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/ci-cache/pip
          key: libclang-${{ runner.os }}-${{ runner.arch }}-py312-18.1.1-v1
      - name: Restore pinned FFmpeg runtime and downloads
        if: github.event_name != 'pull_request'
        id: ffmpeg_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/ffmpeg/prefix
            artifacts/ffmpeg-downloads
          key: ffmpeg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('tools/prepare_ffmpeg.py') }}
      - name: Prepare pinned shared LGPL FFmpeg runtime
        if: github.event_name != 'pull_request'
        run: python tools/prepare_ffmpeg.py --platform ${{ matrix.platform }} --reuse-verified
      - name: Save pinned FFmpeg runtime and downloads
        if: github.event_name == 'push' && steps.ffmpeg_cache.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/ffmpeg/prefix
            artifacts/ffmpeg-downloads
          key: ffmpeg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('tools/prepare_ffmpeg.py') }}
      - name: Release desktop binary with video support
        if: github.event_name != 'pull_request'
        run: python tools/build_desktop.py --task build --ffmpeg --target ${{ matrix.target }} --report artifacts/desktop/desktop-build.json
      - name: Verify packaged-runtime video decoding
        if: github.event_name != 'pull_request'
        run: cargo test -p motion-desktop-media --locked --features ffmpeg --test libav -- --test-threads=1
      - name: Package desktop release archive
        if: github.event_name != 'pull_request'
        run: python tools/package_desktop.py --binary artifacts/desktop/${{ matrix.binary }} --platform ${{ matrix.platform }} --build-report artifacts/desktop/desktop-build.json --output artifacts/desktop-release
      - name: Verify video decoding from the extracted release archive
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          archive=$(python -c 'import json; from pathlib import Path; p=Path("artifacts/desktop-release"); print(p / json.loads((p / "build-info-${{ matrix.platform }}.json").read_text())["archive"])')
          python tools/verify_desktop_video.py --archive "$archive" --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: desktop-release-${{ matrix.platform }}
          path: artifacts/desktop-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Build standalone UI framework gallery
        if: github.event_name != 'pull_request'
        run: cargo build -p motion-ui --example framework --locked --release
      - name: Verify native windows, language and shared MCP
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a python tools/ci_desktop.py --binary artifacts/desktop/motion-studio --output artifacts/desktop
      - name: Verify independent UI framework
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: |
          xvfb-run -a python tools/ci_ui_framework.py --binary target/release/examples/framework --output artifacts/desktop/ui-framework
          xvfb-run -a python tools/ci_ui_framework.py --binary target/release/examples/framework --output artifacts/desktop/ui-framework-custom --style desktop/ui/styles/example.override.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name != 'pull_request'
        with:
          name: desktop-build-${{ matrix.platform }}
          path: artifacts/desktop/**
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve failed PR native playback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && github.event_name == 'pull_request'
        with:
          name: desktop-failure-${{ matrix.platform }}
          path: |
            artifacts/desktop/sampling-playback/costs.json
            artifacts/desktop/sampling-playback/failure.json
            artifacts/desktop/sampling-playback/baseline-costs.json
            artifacts/desktop/sampling-playback/blur-costs.json
            artifacts/desktop/sampling-playback/raster-costs.json
            artifacts/desktop/sampling-playback/combined-costs.json
            artifacts/desktop/sampling-playback/motion-studio.log
            artifacts/desktop/sampling-playback/stderr.log
            artifacts/desktop/sampling-playback/baseline.png
            artifacts/desktop/sampling-playback/blur.png
            artifacts/desktop/sampling-playback/raster.png
            artifacts/desktop/sampling-playback/combined.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve failed PR native capture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && github.event_name == 'pull_request' && runner.os == 'Windows'
        with:
          name: desktop-capture-failure-${{ matrix.platform }}
          path: |
            artifacts/desktop/path-selection/*.failure.json
            artifacts/desktop/path-selection/motion-studio.log
            artifacts/desktop/path-selection/stderr.log
            artifacts/desktop/path-selection/stdout.log
          if-no-files-found: warn
          retention-days: 7

  desktop-media:
    name: Desktop libav backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install libav, Vulkan and native build dependencies
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          grep '^URIs:' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev \
            mesa-vulkan-drivers libvulkan1 libclang-18-dev libasound2-dev
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-ffmpeg
      - name: Build with video import and decoding
        run: python tools/build_desktop.py --task check --ffmpeg
      - name: Test libav probing, seeks and YUV frames
        run: cargo test -p motion-desktop-media --locked --features ffmpeg -- --test-threads=1

  publish:
    name: Publish desktop release
    if: needs.checks.outputs.publish == 'true'
    needs: [checks, desktop, desktop-media, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: artifacts/release/
      - name: Publish verified desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_release.py publish-desktop

[package]
name = "motion-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Immediate-mode widget and dock layout library on winit and wgpu"

[lib]
crate-type = ["rlib"]

[features]
# Preserve the existing default suite. CPU-only local runs opt out explicitly.
default = ["gpu-tests"]
gpu-tests = []

[dependencies]
log.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"
fontdb = "0.23"
ab_glyph = "0.2"
lyon_tessellation = "1.0.22"
unicode-segmentation = "1.13.3"

[dev-dependencies]
motion-render = { path = "../../crates/motion-render", default-features = false }
winit = "0.30"
pollster.workspace = true
image.workspace = true

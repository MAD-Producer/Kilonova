[package]
name = "motion-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motion Studio desktop application"
default-run = "motion-studio"

[[bin]]
name = "motion-studio"
path = "src/main.rs"

[[bin]]
name = "motion-depth-wgsl"
path = "src/depth_worker/main.rs"
test = false
bench = false

[[test]]
name = "depth-worker-admission"
path = "src/depth_worker/tests/admission.rs"

[[test]]
name = "depth-worker-convolution-admission"
path = "src/depth_worker/tests/convolution_admission.rs"

[[test]]
name = "depth-worker-index-admission"
path = "src/depth_worker/tests/index_admission.rs"

[[test]]
name = "depth-worker-graph-admission"
path = "src/depth_worker/tests/graph_admission.rs"

[[test]]
name = "depth-worker-batch-admission"
path = "src/depth_worker/tests/batch_admission.rs"

[[test]]
name = "depth-worker-panic"
path = "src/depth_worker/tests/panic.rs"

[features]
default = ["gpu-tests"]
# Test selection only; product rendering is always compiled.
gpu-tests = ["motion-render/gpu-tests"]
ffmpeg = ["motion-desktop-media/ffmpeg"]

[dependencies]
log.workspace = true
motion-graph = { path = "../../crates/motion-graph", default-features = false }
motion-effects = { path = "../../crates/motion-effects" }
bytemuck.workspace = true
glam.workspace = true
motion-host = { path = "../../crates/motion-host", default-features = false }
motion-core = { path = "../../crates/motion-core" }
motion-render = { path = "../../crates/motion-render", default-features = false }
motion-media = { path = "../../crates/motion-media" }
motion-scene = { path = "../../crates/motion-scene" }
sha2 = "0.10"
motion-desktop-media = { path = "../../crates/motion-desktop-media", default-features = false }
motion-ui = { path = "../ui", default-features = false }
serde.workspace = true
# Saved viewport centers must survive JSON round trips without losing f64 bits.
serde_json = { workspace = true, features = ["float_roundtrip"] }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
wgpu.workspace = true
pollster.workspace = true
raw-window-handle = "0.6"
rfd = "0.15"
image.workspace = true
cpal = "0.16"
fontdb = "0.23"
sentry = { version = "0.49.3", default-features = false, features = ["ureq", "rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
motion-model = { path = "../../crates/motion-model" }
tempfile = "3"

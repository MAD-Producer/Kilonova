[package]
name = "motion-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motion Studio desktop application"

[[bin]]
name = "motion-studio"
path = "src/main.rs"

[features]
default = ["gpu-tests"]
# Test selection only; product rendering is always compiled.
gpu-tests = ["motion-render/gpu-tests"]
ffmpeg = ["motion-desktop-media/ffmpeg"]

[dependencies]
log.workspace = true
motion-graph = { path = "../../crates/motion-graph", default-features = false }
motion-effects = { path = "../../crates/motion-effects" }
bytemuck.workspace = true
glam.workspace = true
motion-host = { path = "../../crates/motion-host", default-features = false }
motion-core = { path = "../../crates/motion-core" }
motion-render = { path = "../../crates/motion-render", default-features = false }
motion-media = { path = "../../crates/motion-media" }
motion-desktop-media = { path = "../../crates/motion-desktop-media", default-features = false }
motion-ui = { path = "../ui", default-features = false }
serde.workspace = true
serde_json.workspace = true
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
wgpu.workspace = true
pollster.workspace = true
raw-window-handle = "0.6"
rfd = "0.15"
image.workspace = true
cpal = "0.16"
fontdb = "0.23"
sentry = { version = "0.49.3", default-features = false, features = ["ureq", "rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"

[dev-dependencies]
motion-model = { path = "../../crates/motion-model" }
motion-scene = { path = "../../crates/motion-scene" }
sha2 = "0.10"
tempfile = "3"

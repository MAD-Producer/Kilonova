[package]
name = "motion-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-neutral editing host shared by the Android and desktop applications"

[lib]
crate-type = ["rlib"]

[features]
default = ["gpu-tests"]
# Test selection only; product rendering is always compiled.
gpu-tests = []
# Reports GPU fault-injection availability in the state snapshot. The Android
# adapter gates actual injection on its own `diagnostics` feature; the host only
# advertises it, so an acceptance build on either platform reports the same key.
diagnostics = []
# Optional desktop inference orchestration; no inference engine enters model/render.
ai-depth = ["dep:motion-model", "dep:tempfile"]

[dependencies]
thiserror.workspace = true
log.workspace = true
motion-effects = { path = "../motion-effects" }
motion-core = { path = "../motion-core" }
motion-render = { path = "../motion-render", default-features = false }
motion-media = { path = "../motion-media" }
motion-model = { path = "../motion-model", optional = true }
tempfile = { version = "3", optional = true }
serde.workspace = true
serde_json.workspace = true
pollster.workspace = true
wgpu.workspace = true
image.workspace = true
bytemuck.workspace = true
glam.workspace = true
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
motion-scene = { path = "../motion-scene" }
sha2 = "0.10"

[target.'cfg(windows)'.dev-dependencies]
winit = "0.30"

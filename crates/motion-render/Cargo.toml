[package]
name = "motion-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
motion-effects = { path = "../motion-effects" }
motion-model = { path = "../motion-model" }
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
image.workspace = true
png = "0.18.1"
sha2 = "0.10"
pollster.workspace = true
thiserror.workspace = true
serde_json.workspace = true
lyon_tessellation = "1.0.22"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
ash = { version = "0.38.0", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }

[dev-dependencies]
motion-core = { path = "../motion-core" }
motion-media = { path = "../motion-media" }
serde.workspace = true
tempfile = "3.17"

[[example]]
name = "performance_baseline"
test = true
